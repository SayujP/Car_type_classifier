<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Car Classifier</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="text-center mb-4">Car Classifier</h1>
        <form action="/predict" method="post" enctype="multipart/form-data" class="text-center">
            <input type="file" name="file" class="form-control mb-3" accept="image/*" required>
            <button type="submit" class="btn btn-primary">Predict</button>
        </form>

        {% if filename %}
        <div class="mt-4 text-center">
            <h4>Prediction: <span class="text-success">{{ class_name }}</span></h4>
            <img src="{{ url_for('static', filename='uploads/' + filename) }}" class="img-fluid mt-3" style="max-width:300px;">
        </div>
        {% endif %}
    </div>
</body>
</html>
